<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeador Tareas DLOV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link  rel = "stylesheet" href ="style.css" >    
</head>

<body>
    <div id="cabecera" class="header text-center">
        <!--Header de la pagina-->
        <h2>Planificador de Actividades</h2>
    </div>
    <!--rejilla principal del diseño de la pagina 4 columnas-->
    <div class="container text-center">
        <div class="row align-items-end mt-4">
            <div class="col-md-4" id="columna_formulario">
                <!--Formulario para asignacion de tarea-->
                <div class="card" id="Trajeta_Formulario">
                    <div class="card-body">
                        <!--Tarjeta del formulario-->
                        <h4 class="card-title" id="Tarejta_form">Ingreso de Actividad</h4>
                        <div class="form-field" id="campo_nombre_tarea">
                            <label for="exampleFormControlTextarea1" class="form-label">Nombre Tarea</label>
                            <input class="form-control" id="input_nombre_tarea"></input>
                        </div>
                        <div class="form-field" id="campo_Descripcion">
                            <label for="exampleFormControlTextarea2" class="form-label"
                                id="label_campo_Descripcion">Descriopción</label>
                            <textarea class="form-control" id="input_Descripcion" rows="4"></textarea>
                        </div>
                        <div class="form-field" id="campo_AsignadoA">
                            <label for="exampleFormControlTextarea1" class="form-label"
                                id="lable_campo_AsignadoA">Asignado a:</label>
                            <input class="form-control" id="input_campo_AsignadoA"></input>
                        </div>
                        <div class="form-field" id="campo_fecha">
                            <label for="exampleFormControlTextarea1" class="form-label" id="lable_campo_fecha">Fecha
                                finalización</label>
                            <input type="datetime-local" class="form-control"
                                aria-label="Date and time picker with seconds" value="2026-02-24T13:00:30" step="1">
                        </div>
                        <div>
                            <div class="form-field">
                                <label for="exampleFormControlSelect2" class="form-label">Prioridad</label>
                                <select class="form-control" id="Barra_selectora">
                                    <option selected >Choose one…</option>
                                    <option value="1" id="opcion_baja">Baja</option>
                                    <option value="2" id="opcion_Media">Media</option>
                                    <option value="3" id="opcion_Alta">Alta</option>
                                </select>
                            </div>

                        </div>
                        <button type="button" class="btn" id="BotonGuardar">Guardar</button>
                    </div>
                </div>
                <div class="col-md-4">
                    <!--calendario 1-->
                </div>
                <div class="colmd-4">
                    <!--calendario 2-->
                </div>
                <div class="col-md-4">
                    <!--calendario 3-->
                </div>
            </div>
        </div>
        <script src="script.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        <div class="foother">

        </div>
</body>

</html>
